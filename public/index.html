
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Lobby | Salón de la Fama</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b14;
      --panel: #15192a;
      --gold: #e8bd63;
      --text: #f5f5fb;
      --muted: #a5acc3;
      --line: #30364c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #25213c, var(--bg) 65%);
      color: var(--text);
    }
    header {
      text-align: center;
      padding: 40px 16px 30px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      color: var(--gold);
      font-weight: 800;
      letter-spacing: .25em;
      font-size: 12px;
    }
    h1 { font-size: clamp(28px, 6vw, 44px); margin: 10px 0 4px; }
    p { color: var(--muted); }
    main { max-width: 1150px; margin: auto; padding: 24px 16px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    button, input, select {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      font: inherit;
    }
    button {
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }
    button.active, button.primary { background: var(--gold); color: #17120a; }
    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    input, select { min-width: 0; width: 100%; background: #101424; color: var(--text); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; min-width: 720px; border-collapse: collapse; }
    th, td { padding: 14px; text-align: left; border-bottom: 1px solid var(--line); }
    th { color: var(--gold); font-size: 12px; text-transform: uppercase; }
    .rank, .time { color: var(--gold); font-weight: 800; }
    .status { color: var(--muted); font-size: 13px; margin: 12px 0; }
    .empty { padding: 28px; text-align: center; color: var(--muted); }
    .verified { color: #8ce2ae; }
    @media (max-width: 700px) {
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 420px) {
      .filters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header>
  <div class="brand">EL LOBBY · COMUNIDAD 7DS</div>
  <h1>Salón de la Fama</h1>
  <p>Récords, gremios y campeones de cada temporada.</p>
</header>

<main>
  <div class="tabs">
    <button class="active" data-game="Origin" data-category="Jefes">Origin · Jefes</button>
    <button data-game="Origin" data-category="Gremios">Origin · Gremios</button>
    <button data-game="Grand Cross" data-category="Jefes">Grand Cross · Jefes</button>
  </div>

  <div class="filters">
    <input id="season" placeholder="Temporada (todas)">
    <input id="challenge" placeholder="Jefe o desafío">
    <select id="verified">
      <option value="false">Todos los registros</option>
      <option value="true">Solo verificados</option>
    </select>
    <button id="refresh" class="primary">Actualizar tabla</button>
  </div>

  <div id="summary" class="status">Conectando con Shopify…</div>

  <section class="panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Jugador / Gremio</th><th>Jefe o desafío</th>
            <th>Tiempo</th><th>Puntuación</th><th>Temporada</th><th>Estado</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="7" class="empty">Cargando registros…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
  <p id="status" class="status"></p>
</main>

<script>
const $ = s => document.querySelector(s);
let game = "Origin";
let category = "Jefes";

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  }[c]));
}

async function loadLeaderboard() {
  $("#rows").innerHTML =
    '<tr><td colspan="7" class="empty">Consultando registros…</td></tr>';
  $("#status").textContent = "";

  const params = new URLSearchParams({
    game,
    category,
    verified: $("#verified").value
  });
  if ($("#season").value.trim())
    params.set("season", $("#season").value.trim());
  if ($("#challenge").value.trim())
    params.set("challenge", $("#challenge").value.trim());

  try {
    const response = await fetch("/api/leaderboard?" + params);
    const data = await response.json();
    if (!response.ok || !data.ok)
      throw new Error(data.error || "No se pudieron cargar los registros.");

    const records = data.leaderboard || [];
    $("#summary").textContent =
      records.length + " registro(s) · " + game + " · " + category;

    $("#rows").innerHTML = records.map(r => `
      <tr>
        <td class="rank">#${r.rank}</td>
        <td><strong>${esc(r.player || r.guild || "Sin nombre")}</strong>
          ${r.player && r.guild ? `<div class="status">${esc(r.guild)}</div>` : ""}
        </td>
        <td>${esc(r.challenge || "—")}</td>
        <td class="time">${esc(r.formattedTime || "—")}</td>
        <td>${esc(r.score || "—")}</td>
        <td>${esc(r.season || "—")}</td>
        <td class="${r.verified ? "verified" : ""}">
          ${r.verified ? "Verificado" : "Pendiente"}
        </td>
      </tr>
    `).join("");

    if (!records.length) {
      $("#rows").innerHTML =
        '<tr><td colspan="7" class="empty">No hay registros para estos filtros.</td></tr>';
    }
    $("#status").textContent = "Consulta terminada.";
  } catch (error) {
    $("#summary").textContent = "No se pudo conectar";
    $("#rows").innerHTML =
      '<tr><td colspan="7" class="empty">No fue posible cargar los registros.</td></tr>';
    $("#status").textContent = "Error: " + error.message;
  }
}

document.querySelectorAll(".tabs button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    game = button.dataset.game;
    category = button.dataset.category;
    loadLeaderboard();
  });
});

$("#refresh").addEventListener("click", loadLeaderboard);
$("#verified").addEventListener("change", loadLeaderboard);
$("#season").addEventListener("keydown", e => {
  if (e.key === "Enter") loadLeaderboard();
});
$("#challenge").addEventListener("keydown", e => {
  if (e.key === "Enter") loadLeaderboard();
});

loadLeaderboard();
</script>
</body>
</html>
